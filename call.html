<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice call</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/css/call.css">
</head>
<body>
  <!-- One call control per frame. The DeepTalk widget runs headlessly underneath. -->
  <div class="call" data-call data-state="loading">
    <button class="orb" type="button" data-orb aria-label="Start call">
      <span class="orb__ripple"></span>
      <span class="orb__ripple"></span>
      <span class="orb__ripple"></span>
      <span class="orb__arc"></span>
      <span class="orb__core">
        <svg class="icon icon--mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        <svg class="icon icon--bars" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 7v10"/><path d="M20 10v4"/></svg>
      </span>
    </button>

    <div class="call__info">
      <p class="call__status"><span data-status>Getting ready&hellip;</span><span class="call__timer" data-timer>00:00</span></p>
      <p class="call__sub" data-sub aria-live="polite">Connecting to the assistant.</p>
      <button class="call__btn" type="button" data-btn disabled>
        <svg class="icon icon--phone" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>
        <span data-btn-label>Start call</span>
      </button>
    </div>
  </div>

  <div class="dt-hidden" aria-hidden="true"><div id="deeptalk-inline-container"></div></div>

  <script src="assets/js/call.js"></script>
</body>
</html>
